name: dreamward
description: A personal consciousness and dream journaling app.
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.3

  # Data models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local database (SQLite via drift)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Persistence (settings)
  shared_preferences: ^2.3.4

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.2
  drift_dev: ^2.23.1
  injectable_generator: ^2.7.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # assets: (uncomment and add entries as real asset files are added)
  #   - assets/images/onboarding/
  #   - assets/images/icons/
  #   - assets/images/placeholders/
